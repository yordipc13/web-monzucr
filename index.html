<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Portafolio de Gabriela Monzú, artista de cerámica.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Gabriela Monzú">
  <meta property="og:title" content="Gabriela Monzú | Portafolio">
  <meta property="og:description" content="Cerámica, obras, formas y detalles.">
  <meta property="og:url" content="./index.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Gabriela Monzú | Portafolio">
  <meta name="twitter:description" content="Cerámica, obras, formas y detalles.">
  <title>Gabriela Monzú | Portafolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/index.css">
  <script type="module" src="/assets/js/index.js"></script>
</head>
<body class="home-page">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <noscript><p class="page-width">Activa JavaScript para explorar el portafolio y sus imágenes.</p></noscript>
  <div id="site-header"></div>
  <main id="contenido">
    <section class="home-carousel page-width" aria-label="Portadas de obras" data-carousel="1">
      <div class="detail-stage home-carousel-stage" tabindex="0" aria-busy="true">
        <div class="detail-skeleton" aria-hidden="true"></div>
        <div class="detail-track" data-carousel-track></div>
        <button class="detail-arrow detail-previous" type="button" aria-label="Obra anterior" disabled>←</button>
        <button class="detail-arrow detail-next" type="button" aria-label="Obra siguiente" disabled>→</button>
      </div>
      <div class="carousel-caption"><span data-carousel-caption></span><span data-carousel-count></span></div>
      <p class="status-message" data-carousel-status role="status"></p>
    </section>

    <section class="gallery-section page-width" id="galeria" aria-labelledby="gallery-preview-title">
      <div class="gallery-heading">
        <div>
          <p class="eyebrow"><span class="eyebrow-line"></span> EXPLORAR</p>
          <h2 id="gallery-preview-title">La <em>galería.</em></h2>
          <p class="section-description">Una selección de obras y sus detalles.</p>
        </div>
      </div>
      <div id="gallery-preview" class="masonry" aria-label="Vista previa de la galería" aria-busy="true">
        <div class="gallery-skeleton"></div><div class="gallery-skeleton"></div><div class="gallery-skeleton"></div><div class="gallery-skeleton"></div><div class="gallery-skeleton"></div><div class="gallery-skeleton"></div>
      </div>
      <p id="gallery-preview-status" class="status-message" role="status"></p>
      <div class="more-wrap gallery-expand-wrap" id="gallery-expand-wrap"><button id="gallery-expand" class="outline-button" type="button">Ver más <span aria-hidden="true">↓</span></button></div>
      <div id="gallery-full" class="gallery-full" hidden>
        <div class="gallery-toolbar">
          <div id="category-filters" class="category-filters" role="group" aria-label="Filtrar por categoría"></div>
          <div data-grid-control></div>
        </div>
        <div id="gallery" class="masonry" aria-label="Galería de obras" aria-busy="true"></div>
        <p id="gallery-status" class="status-message" role="status"></p>
        <div class="more-wrap gallery-load-more" id="gallery-more-wrap" hidden>
          <button id="gallery-more" class="outline-button" type="button">Cargar más <span aria-hidden="true">↓</span></button>
        </div>
        <div id="gallery-sentinel" aria-hidden="true"></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
</body>
</html>
